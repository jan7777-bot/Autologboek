<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Autologboek">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18212a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Autologboek</title>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:500;font-display:swap;src:url(barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(barlow-latin-600-normal.woff2) format("woff2")}
/* Plan: instrumentenpaneel-gevoel. Koel grijs vlak, inktblauw, één staalblauwe accent; statuskleuren apart.
   Layout: kop met voertuigkeuze (kentekenplaten), tabbalk, één kolom kaarten; op breed scherm twee kolommen. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#e4e8ed; --ink:#15202b; --ink-2:#4a5866; --muted:#7a8794;
  --line:#d3d9e0; --accent:#1d5d8f; --accent-ink:#ffffff; --accent-soft:#dbe8f3;
  --good:#1e7a4c; --good-soft:#dcefe4; --warn:#9a6400; --warn-soft:#fbecc8; --bad:#b4282e; --bad-soft:#f8dcdc;
  --plate:#f5c400; --plate-ink:#111; --eu:#003399;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --sunk:#111920; --ink:#e7edf2; --ink-2:#a9b6c2; --muted:#7f8d99;
  --line:#2a3642; --accent:#6aa9dc; --accent-ink:#0b1620; --accent-soft:#1d3245;
  --good:#5cc48d; --good-soft:#163227; --warn:#e7b04a; --warn-soft:#3a2d12; --bad:#f07a7e; --bad-soft:#3d1c1e;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --sunk:#111920; --ink:#e7edf2; --ink-2:#a9b6c2; --muted:#7f8d99;
  --line:#2a3642; --accent:#6aa9dc; --accent-ink:#0b1620; --accent-soft:#1d3245;
  --good:#5cc48d; --good-soft:#163227; --warn:#e7b04a; --warn-soft:#3a2d12; --bad:#f07a7e; --bad-soft:#3d1c1e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 8px}
.brand{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.02em}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.err{background:var(--bad-soft);color:var(--bad)}
.vehicles{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.vehicles::-webkit-scrollbar{display:none}
.vbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;cursor:pointer;min-width:150px;text-align:left}
.vbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.vbtn .vname{font-size:13px;color:var(--ink-2);font-weight:500}
.plate{display:inline-flex;align-items:stretch;border-radius:4px;overflow:hidden;background:var(--plate);color:var(--plate-ink);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;border:1px solid #0003;line-height:1}
.plate .eu{background:var(--eu);color:#fff;font-size:8px;padding:3px 3px 2px;display:flex;align-items:flex-end;letter-spacing:0}
.plate .txt{padding:4px 7px 3px}
.plate.big{font-size:22px}.plate.big .eu{font-size:10px;padding:4px}.plate.big .txt{padding:6px 10px 5px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--ink-2);font-weight:500;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-top:16px;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.grid{display:grid;gap:14px}
@media (min-width:860px){.grid.two{grid-template-columns:1.15fr 1fr;align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--sunk);border-radius:10px;padding:12px;display:grid;gap:2px;min-width:0}
.tile .lab{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.tile .val{font-family:var(--display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .note{font-size:12px;color:var(--muted)}

.odo{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.odo-digits{display:inline-flex;gap:3px;font-family:var(--mono);font-weight:600;font-size:28px}
.odo-digits span{background:var(--ink);color:var(--surface);border-radius:4px;padding:2px 5px;min-width:1.05em;text-align:center}
.odo-digits .unit{background:none;color:var(--ink-2);font-size:16px;align-self:flex-end;padding:0 0 4px 4px;font-family:var(--body)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:10px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.banner.info{background:var(--accent-soft);border-left-color:var(--accent)}
.banner strong{display:block}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

form.f{display:grid;gap:10px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.fl{display:grid;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px}
textarea{min-height:120px;resize:vertical;font-size:14px;line-height:1.5}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.taskpick{display:grid;gap:4px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.taskpick .grp{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.hint{font-size:13px;color:var(--muted)}

.list{display:grid}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.item .m{font-size:13px;color:var(--muted);grid-column:1}
.item .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.item .acts{grid-column:2;display:flex;gap:6px;justify-content:flex-end}
@media (max-width:560px){.item .acts{grid-column:1 / -1;justify-content:flex-start;flex-wrap:wrap}}

.due{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.due:first-child{border-top:0}
.chip{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:99px;white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.chip.over{background:var(--bad-soft);color:var(--bad)}
.chip.binnenkort{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.onbekend{background:var(--sunk);color:var(--ink-2)}
.chip.prijs-goedkoop{background:var(--accent-soft);color:var(--accent)}
.imp{font-family:var(--mono);font-size:13px;min-height:160px}
pre.instr{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:var(--sunk);border-radius:8px;padding:10px;max-height:260px;overflow:auto;margin:0}
.due .t{font-weight:500}
.due .m{font-size:13px;color:var(--muted);grid-column:2}
.due .acts{grid-row:1 / span 2;grid-column:3}

table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
dl.specs{display:grid;grid-template-columns:minmax(120px,1fr) 1.3fr;gap:0;margin:0;font-size:14px}
dl.specs dt,dl.specs dd{margin:0;padding:6px 0;border-bottom:1px solid var(--line)}
dl.specs dt{color:var(--ink-2)}
dl.specs dd{font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--accent);font-weight:500}

.bars{display:grid;gap:10px}
.bar{display:grid;gap:4px}
.bar .bl{display:flex;justify-content:space-between;font-size:14px}
.bar .track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}

.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.todo{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo .t{flex:1;overflow-wrap:anywhere}
.todo.done .t{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 24px #0003;display:none}
.steps{display:grid;gap:8px;margin:0;padding-left:20px}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .2s}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Autologboek</div>
      <span id="savepill" class="pill">Laden…</span>
    </div>
    <div class="vehicles" id="vehicles" role="group" aria-label="Kies voertuig"></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
// ---------- Onderhoudsschema ----------
const TIERS = {1:{km:5000,mnd:1},2:{km:15000,mnd:6},3:{km:30000,mnd:12},4:{km:100000,mnd:60}};
const SCHEMA_AUTO = [
  ["olie","Motorolie & oliefilter",[[1,"Controleren & eventueel bijvullen"],[2,"Verversen"]]],
  ["koel","Koelvloeistof",[[1,"Controleren & bijvullen"],[3,"Verversen"]]],
  ["sproei","Ruitensproeiervloeistof",[[1,"Bijvullen"]]],
  ["banden","Banden (spanning & profiel)",[[1,"Controleren"],[3,"Uitlijnen & balanceren"]]],
  ["remmen","Remmen (vloeistof, blokken, schijven)",[[1,"Visuele controle"],[2,"Vloeistof controleren/verversen"],[3,"Blokken/schijven vervangen indien nodig"]]],
  ["lucht","Luchtfilter",[[2,"Controleren & indien nodig vervangen"]]],
  ["brandstof","Brandstoffilter",[[4,"Vervangen"]]],
  ["bougies","Bougies",[[4,"Controleren & vervangen indien nodig"]]],
  ["distributie","Distributieriem/-ketting",[[4,"Vervangen volgens fabrieksspecificatie"]]],
  ["accu","Accu & dynamo",[[1,"Controleren"],[3,"Testen"],[4,"Vervangen indien nodig"]]],
  ["bak","Versnellingsbakolie",[[4,"Controleren/verversen"]]],
  ["uitlaat","Uitlaatsysteem",[[3,"Controleren op lekkages"]]],
  ["airco","Airco-onderhoud",[[3,"Airco bijvullen & reinigen"]]],
  ["ophanging","Ophanging & stuurinrichting",[[1,"Visuele inspectie"],[3,"Uitgebreide controle"]]]
];
const SCHEMAS = {auto:[], motor:[
  {id:"m-bmw",part:"Fabrieksbeurt",actie:"Jaarlijkse service volgens fabrikant",km:10000,mnd:12},
  {id:"m-olie",part:"Motorolie & oliefilter",actie:"Verversen",km:5000,mnd:6},
  {id:"m-lucht",part:"Luchtfilter",actie:"Controleren, reinigen of vervangen",km:10000,mnd:12},
  {id:"m-banden",part:"Banden",actie:"Spanning en slijtage controleren",km:5000,mnd:null},
  {id:"m-ketting",part:"Ketting en tandwielen",actie:"Reinigen, smeren en spanning controleren",km:1000,mnd:null},
  {id:"m-remblok",part:"Remblokken",actie:"Controleren, vervangen bij slijtage",km:10000,mnd:null},
  {id:"m-remvl",part:"Remvloeistof",actie:"Vervangen",km:null,mnd:24},
  {id:"m-koel",part:"Koelvloeistof",actie:"Controleren of vervangen",km:null,mnd:24},
  {id:"m-bougies",part:"Bougies",actie:"Controleren of vervangen",km:10000,mnd:null},
  {id:"m-ophanging",part:"Voorvork en achterdemper",actie:"Controleren op lekkage en schade",km:10000,mnd:null},
  {id:"m-licht",part:"Verlichting & elektronica",actie:"Controleren",km:null,mnd:6},
  {id:"m-accu",part:"Accu",actie:"Laadspanning controleren, polen reinigen",km:null,mnd:6}
]};
SCHEMA_AUTO.forEach(([pid,part,acts])=>acts.forEach(([tier,actie])=>SCHEMAS.auto.push({id:pid+"-"+tier,part,actie,km:TIERS[tier].km,mnd:TIERS[tier].mnd})));
const TASK = Object.fromEntries(SCHEMAS.auto.concat(SCHEMAS.motor).map(t=>[t.id,t]));
const soortOf=v=>v&&v.soort==="motor"?"motor":"auto";
const tasksFor=v=>SCHEMAS[soortOf(v)];
function intervalLabel(t){const p=[];if(t.km)p.push("elke "+nl0.format(t.km)+" km");
  if(t.mnd)p.push(t.mnd===1?"elke maand":t.mnd===12?"elk jaar":t.mnd%12===0?"elke "+(t.mnd/12)+" jaar":"elke "+t.mnd+" maanden");return p.join(" of ")}

// ---------- Richtprijzen (incl. btw, Nederland 2025-2026; indicatie) ----------
const PRIJZEN = {
 auto:[
  {id:"apk",naam:"APK-keuring",min:30,max:75,re:/\bapk\b/i},
  {id:"klein",naam:"Kleine beurt",min:100,max:250,re:/kleine\s*(onderhouds)?beurt/i,beurt:true},
  {id:"groot",naam:"Grote beurt",min:300,max:600,re:/grote\s*(onderhouds)?beurt/i,beurt:true,vervangt:["klein"]},
  {id:"olie",naam:"Olie en oliefilter verversen (los)",min:80,max:180,re:/olie\s*(verversen|wissel)|olieverversing|oliewissel/i,binnenBeurt:true,taken:["olie-2"]},
  {id:"remblok",naam:"Remblokken vervangen, per as",min:100,max:250,re:/remblok/i,perAs:true},
  {id:"remschijf",naam:"Remschijven + remblokken, per as",min:300,max:600,re:/remschij/i,perAs:true,vervangt:["remblok"],taken:["remmen-3"]},
  {id:"remvl",naam:"Remvloeistof vervangen",min:60,max:130,re:/rem\s*vloeistof/i,binnenBeurt:true,taken:["remmen-2"]},
  {id:"bougies",naam:"Bougies vervangen",min:80,max:250,re:/bougie/i,binnenBeurt:true,taken:["bougies-4"]},
  {id:"distributie",naam:"Distributieriem vervangen",min:400,max:1000,re:/distributie/i,taken:["distributie-4"]},
  {id:"banden",naam:"Autoband incl. montage, per stuk",min:90,max:175,re:/\bband(en)?\b|voorband|achterband/i,perStuk:true},
  {id:"uitlijnen",naam:"Uitlijnen",min:45,max:90,re:/uitlijn/i,taken:["banden-3"]},
  {id:"airco",naam:"Airco-service (bijvullen)",min:75,max:150,re:/airco/i,taken:["airco-3"]},
  {id:"accu",naam:"Accu vervangen",min:120,max:300,re:/accu\s*vervang|nieuwe\s*accu/i,taken:["accu-4"]},
  {id:"schokdemper",naam:"Schokdempers, per as",min:350,max:850,re:/schokdemper/i,perAs:true},
  {id:"uitlaat",naam:"Uitlaat (deel) vervangen",min:150,max:800,re:/uitlaat/i}
 ],
 motor:[
  {id:"m-klein",naam:"Kleine of jaarlijkse beurt (10.000 km)",min:130,max:300,re:/kleine\s*(onderhouds)?beurt|jaarlijkse\s*(beurt|service)|10[.\s]?000\s*km[-\s]*(beurt|service)|afleverings?beurt/i,beurt:true,taken:["m-bmw"]},
  {id:"m-groot",naam:"Grote beurt (20.000 km, klepspeling)",min:400,max:800,re:/grote\s*(onderhouds)?beurt|20[.\s]?000\s*km[-\s]*(beurt|service)|klepspeling/i,beurt:true,vervangt:["m-klein"]},
  {id:"m-ketting",naam:"Kettingset vervangen incl. montage",min:180,max:400,re:/ketting\s*(set|kit)|kettingset|kettingkit|nieuwe\s*ketting/i},
  {id:"m-banden",naam:"Motorband incl. montage, per stuk",min:120,max:300,re:/\bband(en)?\b|voorband|achterband/i,perStuk:true},
  {id:"m-remblok",naam:"Remblokken vervangen, per as",min:100,max:200,re:/remblok/i,perAs:true,taken:["m-remblok"]},
  {id:"m-remvl",naam:"Remvloeistof vervangen",min:50,max:120,re:/rem\s*vloeistof/i,binnenBeurt:true,taken:["m-remvl"]},
  {id:"m-olie",naam:"Olie en oliefilter verversen (los)",min:80,max:160,re:/olie\s*(verversen|wissel)|olieverversing|oliewissel/i,binnenBeurt:true,taken:["m-olie"]},
  {id:"m-bougies",naam:"Bougies vervangen",min:60,max:150,re:/bougie/i,binnenBeurt:true,taken:["m-bougies"]}
 ]};
const UURTARIEF={min:61,gem:82,max:165};
const PRIJSBRON="Richtprijzen inclusief btw voor Nederland (2025–2026), samengesteld uit ANWB, Werkspot, Univé, AutoScout24, KwikFit en Quispel Motoren (BMW F-serie). Het is een indicatie: merk, type en garage maken veel uit, en een merkdealer is vaak duurder.";
function qtyBanden(t){const m=t.match(/(\d)\s*[x×]?\s*(?:nieuwe\s+)?(?:[a-z]+[\s-]+){0,2}?band(?:en)?\b/i);if(m&&+m[1]>0)return +m[1];
  if(/voor.{0,10}(en|\+|&).{0,10}achter/i.test(t)&&/band/i.test(t))return 2;
  const n=(t.match(/(voor|achter)band/gi)||[]).length;return n}
function matchPrijzen(v,u){
  const omschr=String(u.omschr||"").replace(/\([^)]*\)/g," "), all=omschr+"\n"+(u.regels||[]).map(r=>r.omschr).join("\n");
  let hits=PRIJZEN[soortOf(v)].filter(p=>p.re.test(all));
  if(hits.some(h=>h.beurt))hits=hits.filter(h=>!h.binnenBeurt);
  const drop=new Set(hits.flatMap(h=>h.vervangt||[])); hits=hits.filter(h=>!drop.has(h.id));
  if(!hits.length)return null;
  const both=/voor.{0,12}(en|\+|&).{0,12}achter|2\s*sets?\b/i.test(all);
  const items=hits.map(h=>{let q=1;if(h.perStuk)q=qtyBanden(omschr)||qtyBanden(all)||1;if(h.perAs&&both)q=2;return {id:h.id,naam:h.naam,q,min:h.min*q,max:h.max*q}});
  return {items,min:items.reduce((a,i)=>a+i.min,0),max:items.reduce((a,i)=>a+i.max,0),all};
}
function uurtarief(u){
  const btwApart=(u.regels||[]).some(r=>/btw/i.test(r.omschr));
  for(const r of u.regels||[]){ if(!(r.bedrag>0)||!/arbeid|uurloon|loon/i.test(r.omschr))continue;
    const m=r.omschr.match(/(\d+(?:[.,]\d+)?)\s*(?:uur|u)\b/i); if(!m)continue; const h=parseNum(m[1]); if(!h)continue;
    return Math.round(r.bedrag/h*(btwApart?1.21:1)*100)/100; }
  return null;
}
const OORDEEL={goedkoop:["Goedkoop","prijs-goedkoop"],normaal:["Normale prijs","ok"],hoog:["Aan de hoge kant","binnenkort"],duur:["Duur","over"]};
function prijsCheck(v,u){
  if(!u||!(u.bedrag>0)||!["Onderhoud","Reparatie","APK"].includes(u.cat))return null;
  const m=matchPrijzen(v,u); if(!m)return null;
  if(!/arbeid|uurloon|montage|monter|beurt|keuring|\bapk\b|service|vervang|uitgevoerd|uitlijn/i.test(m.all))return null;
  const b=u.bedrag; const oordeel=b<m.min*0.9?"goedkoop":b>m.max*1.2?"duur":b>m.max?"hoog":"normaal";
  return {...m,oordeel,uur:uurtarief(u)};
}
function prijsChip(pc){if(!pc)return "";const [t,c]=OORDEEL[pc.oordeel];return `<span class="chip ${c}">${t}</span>`}
function prijsUitleg(pc){return "richtprijs "+eur0(pc.min)+"–"+eur0(pc.max)+" voor "+pc.items.map(i=>(i.q>1?i.q+"× ":"")+i.naam.replace(/, per (stuk|as)/,"").toLowerCase()).join(" + ")}
function monteurTekst(v,u,pc){return `Ik heb ${eur(u.bedrag)} betaald voor: ${u.omschr} (${fdate(u.datum)}). Volgens richtprijzen in Nederland kost dit meestal ${eur0(pc.min)} tot ${eur0(pc.max)} (${pc.items.map(i=>(i.q>1?i.q+"× ":"")+i.naam).join(" + ")}).${pc.uur?` Het uurtarief op de factuur is ongeveer ${eur(pc.uur)}, gemiddeld is dat ${eur0(UURTARIEF.gem)}.`:""} Kunt u uitleggen waar het verschil in zit?`}
function taakPrijs(v,id){const p=PRIJZEN[soortOf(v)].find(x=>(x.taken||[]).includes(id));return p?"ca. "+eur0(p.min)+"–"+eur0(p.max):""}

// ---------- Hulpfuncties ----------
const nlEur = new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"});
const nlEur0 = new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const nl0 = new Intl.NumberFormat("nl-NL",{maximumFractionDigits:0});
const nl1 = new Intl.NumberFormat("nl-NL",{minimumFractionDigits:1,maximumFractionDigits:1});
const nl2 = new Intl.NumberFormat("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2});
const eur = n=>nlEur.format(n||0), eur0=n=>nlEur0.format(n||0);
const km = n=>n==null?"—":nl0.format(n)+" km";
const MAANDEN=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function fdate(iso){if(!iso)return"—";const[y,m,d]=iso.split("-").map(Number);return d+" "+MAANDEN[m-1]+" "+y}
function todayIso(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function toDate(iso){const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)}
function days(a,b){return Math.round((toDate(b)-toDate(a))/86400000)}
function addMonths(iso,n){const d=toDate(iso);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fullMonths(a,b){const A=toDate(a),B=toDate(b);let m=(B.getFullYear()-A.getFullYear())*12+(B.getMonth()-A.getMonth());if(B.getDate()<A.getDate())m--;return Math.max(0,m)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function parseNum(s){s=String(s??"").trim().replace(/[€\s]/g,"");if(!s)return null;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=Number(s);return isFinite(n)?n:null}
function parseKm(s){s=String(s??"").replace(/[^\d]/g,"");return s?Number(s):null}
function rel(n){if(n===0)return"vandaag";if(n===1)return"gisteren";return n+" dagen geleden"}

// ---------- Berekeningen ----------
function V(){return state.vehicles.find(v=>v.id===state.active)||state.vehicles[0]}
function currentKm(v){let m=v.startKm;for(const e of v.fuel)if(e.km!=null&&(m==null||e.km>m))m=e.km;for(const u of v.uitgaven)if(u.km!=null&&(m==null||u.km>m))m=u.km;if(v.schemaStart&&v.schemaStart.km!=null&&(m==null||v.schemaStart.km>m))m=v.schemaStart.km;return m}
function lastKmEntry(v){return [...v.fuel].sort((a,b)=>a.datum<b.datum?1:a.datum>b.datum?-1:b.km-a.km)[0]||null}
function segments(v){
  const f=v.fuel.filter(e=>e.bedrag||e.liters).sort((a,b)=>a.km-b.km||(a.datum<b.datum?-1:1));
  const out=[];let prev=null,L=0,E=0,okL=true;
  for(const e of f){
    if(prev){L+=e.liters||0;E+=e.bedrag||0;if(!e.liters)okL=false;
      if(e.vol){const d=e.km-prev.km;if(d>0)out.push({id:e.id,datum:e.datum,km:d,liters:okL?L:null,euro:E});prev=e;L=0;E=0;okL=true}}
    else if(e.vol)prev=e;
  }
  return out;
}
function avgUse(v){const s=segments(v).filter(x=>x.liters);const K=s.reduce((a,x)=>a+x.km,0),L=s.reduce((a,x)=>a+x.liters,0);
  const s2=segments(v);const K2=s2.reduce((a,x)=>a+x.km,0),E2=s2.reduce((a,x)=>a+x.euro,0);
  return {l100:K?L/K*100:null,op:L?K/L:null,e100:K2?E2/K2*100:null,n:s.length}}
function taskStatus(v){
  const cur=currentKm(v),t=todayIso();
  return tasksFor(v).map(task=>{
    const done=v.uitgaven.filter(u=>(u.taken||[]).includes(task.id)).sort((a,b)=>a.datum<b.datum?1:-1)[0];
    let base=null;
    if(done)base={km:done.km!=null?done.km:(v.schemaStart?.km??null),datum:done.datum,bron:"done"};
    else if(v.schemaStart&&(v.schemaStart.datum||v.schemaStart.km!=null))base={km:v.schemaStart.km,datum:v.schemaStart.datum,bron:"start"};
    if(!base)return {...task,status:"onbekend",score:9,dueKm:null,dueDate:null};
    const dueKm=base.km!=null&&task.km?base.km+task.km:null, dueDate=base.datum&&task.mnd?addMonths(base.datum,task.mnd):null;
    const restKm=dueKm!=null&&cur!=null?dueKm-cur:null, restD=dueDate?days(t,dueDate):null;
    if(restKm==null&&restD==null)return {...task,status:"onbekend",score:9,dueKm:null,dueDate:null,last:done||null};
    const soonKm=task.km?Math.max(task.km<=1000?150:500,task.km*.1):0, soonD=task.mnd===1?7:30;
    let status="ok";
    if((restKm!=null&&restKm<=0)||(restD!=null&&restD<=0))status="over";
    else if((restKm!=null&&restKm<=soonKm)||(restD!=null&&restD<=soonD))status="binnenkort";
    const fr=[];if(restKm!=null)fr.push(restKm/task.km);if(restD!=null)fr.push(restD/(task.mnd*30.4));
    return {...task,status,restKm,restD,dueKm,dueDate,last:done||null,score:fr.length?Math.min(...fr):5};
  }).sort((a,b)=>a.score-b.score);
}
function apkStatus(v){if(!v.apk)return null;const d=days(todayIso(),v.apk);return {d,status:d<0?"over":d<=60?"binnenkort":"ok"}}
const MND_KORT={jan:1,feb:2,mrt:3,maa:3,apr:4,mei:5,jun:6,jul:7,aug:8,sep:9,okt:10,nov:11,dec:12};
function parseMaanden(t){return [...new Set((String(t||"").toLowerCase().match(/[a-z]+/g)||[]).map(w=>MND_KORT[w.slice(0,3)]).filter(Boolean))].sort((a,b)=>a-b)}
const maandNamen=arr=>(arr||[]).map(m=>MAANDEN[m-1]).join(", ");
function lastTekst(l){return l.naam+": "+String(l.bedrag).replace(".",",")+((l.niet||[]).length?" (niet in "+maandNamen(l.niet)+")":"")}
function parseLastRegel(line){const m=line.match(/^(.*?):\s*([^()]+?)\s*(?:\((?:niet|behalve|geschorst)?\s*(?:in)?\s*([^)]*)\))?\s*$/i);if(!m)return null;const n=parseNum(m[2]);if(n==null||!m[1].trim())return null;const niet=parseMaanden(m[3]);return niet.length?{naam:m[1].trim(),bedrag:Math.abs(n),niet}:{naam:m[1].trim(),bedrag:Math.abs(n)}}
function lastenInMaand(v,mnd){return v.lasten.reduce((a,l)=>a+((l.niet||[]).includes(mnd)?0:(l.bedrag||0)),0)}
function vasteLasten(v,maanden){let t=0;for(let k=0;k<maanden;k++){const m=toDate(addMonths(v.eigendomSinds,k)).getMonth()+1;t+=lastenInMaand(v,m)}return t}
function voorAankoop(v,u){return !!(v.eigendomSinds&&u.cat!=="Aankoop"&&u.datum&&u.datum<v.eigendomSinds)}
function eigenUitgaven(v){return v.uitgaven.filter(u=>!voorAankoop(v,u))}
function costs(v){
  const own=eigenUitgaven(v), ownFuel=v.fuel.filter(e=>!v.eigendomSinds||e.datum>=v.eigendomSinds);
  const sum=c=>own.filter(u=>c(u.cat)).reduce((a,u)=>a+(u.bedrag||0),0);
  const aankoop=sum(c=>c==="Aankoop"), onderhoud=sum(c=>["Onderhoud","Reparatie","Onderdelen","APK"].includes(c)), overig=sum(c=>c==="Overig");
  const brandstof=ownFuel.reduce((a,e)=>a+(e.bedrag||0),0);
  const perMaand=v.lasten.reduce((a,l)=>a+(l.bedrag||0),0);
  const maanden=v.eigendomSinds?fullMonths(v.eigendomSinds,todayIso()):0;

  const cur=currentKm(v); const kms=ownFuel.map(e=>e.km).concat(own.map(u=>u.km)).filter(x=>x!=null);

  const vorig=v.uitgaven.filter(u=>voorAankoop(v,u)).reduce((a,u)=>a+(u.bedrag||0),0);

function describeDue(s){
  if(s.status==="onbekend")return "Nog niet vastgelegd wanneer dit voor het laatst is gedaan";
  const p=[];
  if(s.restKm!=null)p.push(s.restKm<=0?nl0.format(-s.restKm)+" km over tijd":"over "+nl0.format(s.restKm)+" km (bij "+nl0.format(s.dueKm)+")");
  if(s.restD!=null)p.push(s.restD<=0?(s.restD===0?"vandaag":(-s.restD)+" dagen over tijd"):"uiterlijk "+fdate(s.dueDate));
  return p.join(" · ")+(s.last?" — laatst "+fdate(s.last.datum):"");

async function saveFile(name,text,type){
  const f=new File([text],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}}
  catch(e){if(e&&e.name==="AbortError")return false}
  const u=URL.createObjectURL(f),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);return true;
}
async function exportBackup(){if(await saveFile("autologboek-backup-"+todayIso()+".json",backupText(),"application/json")){state.lastBackup=new Date().toISOString();save();render();toast("Back-up gemaakt. Kies 'Bewaar in Bestanden' en dan iCloud Drive.")}}
function parseBackup(t){const d=JSON.parse(String(t).trim());const st=d&&d.state?d.state:d;if(!st||!Array.isArray(st.vehicles))throw new Error("geen back-up");

function drawChart(v){
  const el=document.getElementById("chart"); if(!el)return;
  const s=segments(v).filter(x=>x.liters).map(x=>({...x,y:x.liters/x.km*100}));
  if(s.length<2){el.innerHTML=`<p class="empty">Na drie volle tanks met liters zie je hier hoe het verbruik verloopt.</p>`;return}
  const W=640,H=210,L=40,R=16,T=14,B=28;
  const ys=s.map(p=>p.y).concat(v.nedc?[v.nedc]:[]);
  let lo=Math.floor(Math.min(...ys)-.5),hi=Math.ceil(Math.max(...ys)+.5); if(lo<0)lo=0;
  const X=i=>L+(s.length===1?0:i*(W-L-R)/(s.length-1)), Y=y=>T+(hi-y)*(H-T-B)/(hi-lo);
  const ticks=[lo,(lo+hi)/2,hi];
  const css=getComputedStyle(document.documentElement), c=n=>css.getPropertyValue(n).trim();
  const path=s.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=path+` L${X(s.length-1).toFixed(1)} ${H-B} L${X(0).toFixed(1)} ${H-B} Z`;
  const lastI=s.length-1;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verbruik in liter per 100 km per tankbeurt">
   ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="${c("--line")}" stroke-width="1"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="${c("--muted")}">${nl1.format(t)}</text>`).join("")}
   ${v.nedc?`<line x1="${L}" x2="${W-R}" y1="${Y(v.nedc)}" y2="${Y(v.nedc)}" stroke="${c("--ink-2")}" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-R}" y="${Y(v.nedc)-5}" text-anchor="end" font-size="11" fill="${c("--ink-2")}">fabriek ${nl1.format(v.nedc)}</text>`:""}
   <path d="${area}" fill="${c("--accent")}" opacity=".12"/>
   <path d="${path}" fill="none" stroke="${c("--accent")}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${X(lastI)}" cy="${Y(s[lastI].y)}" r="4.5" fill="${c("--accent")}" stroke="${c("--surface")}" stroke-width="2"/>
   <text x="${L}" y="${H-8}" font-size="11" fill="${c("--muted")}">${fdate(s[0].datum)}</text>
   <text x="${W-R}" y="${H-8}" font-size="11" text-anchor="end" fill="${c("--muted")}">${fdate(s[lastI].datum)}</text>
   <circle id="hov" r="4.5" fill="${c("--accent")}" stroke="${c("--surface")}" stroke-width="2" style="display:none"/>
   ${s.map((p,i)=>{const w=(W-L-R)/Math.max(1,s.length-1);return `<rect data-i="${i}" x="${X(i)-w/2}" y="${T}" width="${w}" height="${H-T-B}" fill="transparent"/>`}).join("")}
  </svg><div class="tip" id="tip"></div><p class="sub">Liter per 100 km per volle tank; lager is zuiniger.</p>`;
  const svg=el.querySelector("svg"),tip=el.querySelector("#tip"),hov=el.querySelector("#hov");
  const show=i=>{const p=s[i];const r=svg.getBoundingClientRect(),k=r.width/W;hov.setAttribute("cx",X(i));hov.setAttribute("cy",Y(p.y));hov.style.display="";
    tip.style.display="block";tip.style.left=X(i)*k+"px";tip.style.top=Y(p.y)*k+"px";tip.textContent=fdate(p.datum)+": "+nl1.format(p.y)+" l/100 km (1 op "+nl1.format(100/p.y)+")"};
  svg.querySelectorAll("rect[data-i]").forEach(rc=>{rc.addEventListener("pointerenter",()=>show(+rc.dataset.i));rc.addEventListener("pointerdown",()=>show(+rc.dataset.i))});
  svg.addEventListener("pointerleave",()=>{tip.style.display="none";hov.style.display="none"});
}

function parseDate(x){x=String(x||"").trim();let m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  m=x.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);if(!m)return null;let y=m[3];if(y.length===2)y="20"+y;
  const d=m[1].padStart(2,"0"),mo=m[2].padStart(2,"0");if(+mo<1||+mo>12||+d<1||+d>31)return null;return y+"-"+mo+"-"+d}
const normKent=k=>String(k||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function splitLast(val){const i=Math.max(val.lastIndexOf(";"),val.lastIndexOf("|"));return i>0?[val.slice(0,i).trim(),val.slice(i+1).trim()]:[val.trim(),""]}
function parseImport(text){
  text=String(text||"").replace(/\r/g,"").replace(/```[a-zA-Z]*/g,"").replace(/\*\*/g,"");
  const blocks=text.split(/^\s*-{3,}\s*$/m), items=[];
  for(const blk of blocks){
    const o={regels:[],schema:[],notitie:[],lasten:[],specs:[],klussen:[]};let any=false;
    for(let line of blk.split("\n")){
      line=line.replace(/^\s*[-*•]\s+/,"").trim(); if(!line||line.startsWith("#"))continue;
      const m=line.match(/^([A-Za-zÀ-ÿ \-\/]+?)\s*:\s*(.*)$/); if(!m)continue;
      const k=m[1].toLowerCase().replace(/[\s\-\/]+/g," ").trim(), val=m[2].trim(); any=true;
      if(k==="type"||k==="document")o.type=val.toLowerCase();
      else if(k==="kenteken")o.kenteken=val;
      else if(k==="naam")o.naam=val;
      else if(k==="datum")o.datum=parseDate(val);
      else if(["km","km stand","kilometerstand","tellerstand"].includes(k))o.km=parseKm(val);
      else if(k==="km bij aankoop")o.startKm=parseKm(val);
      else if(k==="soort"||k==="categorie")o.soort=val;
      else if(k==="omschrijving")o.omschr=val;
      else if(k==="totaal"||k==="bedrag")o.bedrag=parseNum(val);
      else if(k==="liters")o.liters=parseNum(val);
      else if(k==="vol"||k==="volle tank")o.vol=!/^(nee|n|no|false|0)$/i.test(val);
      else if(k==="regel"){const [a,b]=splitLast(val);o.regels.push({omschr:a,bedrag:b?parseNum(b):null})}
      else if(k==="schema"||k==="taken")o.schema.push(...val.split(/[,;\s]+/).map(x=>x.trim().toLowerCase()).filter(Boolean));
      else if(k==="geldig tot"||k==="apk geldig tot"||k==="apk")o.apkTot=parseDate(val);
      else if(k==="notitie"||k==="opmerking")o.notitie.push(val);
      else if(k==="merk model"||k==="merk en model"||k==="model"||k==="type voertuig")o.merkModel=val;
      else if(k==="brandstof")o.brandstof=val;
      else if(k==="bouwjaar")o.bouwjaar=val;
      else if(k==="in bezit sinds"||k==="eigendom sinds"||k==="gekocht op")o.sinds=parseDate(val);
      else if(k==="verbruik"||k==="fabrieksverbruik")o.nedc=parseNum(val);
      else if(k==="last"){const p=val.split(/[;|]/).map(x=>x.trim());const n=parseNum(p[1]);if(p[0]&&n!=null){const niet=parseMaanden(p.slice(2).join(" "));o.lasten.push(niet.length?{naam:p[0],bedrag:Math.abs(n),niet}:{naam:p[0],bedrag:Math.abs(n)})}}
      else if(k==="gegeven"){const [a,b]=splitLast(val);if(a)o.specs.push([a,b])}
      else if(k==="klus"||k==="klusje")o.klussen.push(val);
    }
    if(!any)continue;
    if(!o.type)o.type=o.liters!=null?"tanken":o.apkTot&&!o.merkModel?"apk":(o.omschr||o.bedrag!=null)?"onderhoud":o.merkModel?"voertuig":"km";
    items.push(o);
  }
  return items;
}

    const warn=[]; let tgt=o.kenteken?state.vehicles.find(x=>x.kenteken&&normKent(x.kenteken)===normKent(o.kenteken)):null, nieuw=false;
    if(!tgt){tgt=state.vehicles.find(x=>isEmptyVehicle(x)&&!used.has(x.id));nieuw=!!tgt}
    if(tgt){used.add(tgt.id);if(o.kenteken)plan[normKent(o.kenteken)]=tgt.id;if(o.soort)soortPlan[tgt.id]=/motor/i.test(o.soort)?"motor":"auto"}
    else warn.push("geen lege plek voor een nieuw voertuig");
    const ok=!!tgt&&!!(o.naam||o.kenteken);
    if(!o.naam&&!o.kenteken)warn.push("geen naam of kenteken");
    return {...o,vid:tgt?tgt.id:null,nieuw,veh:true,fuel:false,warn,ok,sel:ok};
  });
  const rest=items.filter(o=>o.type!=="voertuig").map(o=>{
    const warn=[]; let v=V();
    if(o.kenteken){const id=plan[normKent(o.kenteken)];const f=id?state.vehicles.find(x=>x.id===id):state.vehicles.find(x=>x.kenteken&&normKent(x.kenteken)===normKent(o.kenteken));if(f)v=f;else warn.push("kenteken "+o.kenteken+" niet gevonden, komt bij "+V().naam)}
    const soort=soortPlan[v.id]||soortOf(v), vs={...v,soort};
    const fuel=o.type==="tanken"||o.type==="km"||o.type==="kmstand";
    const valid=new Set(SCHEMAS[soort].map(t=>t.id));
    const unknown=o.schema.filter(id=>!valid.has(id)); if(unknown.length)warn.push("code hoort niet bij deze "+soort+": "+unknown.join(", "));
    o.schema=o.schema.filter(id=>valid.has(id));
    let ok=true;
    if(!o.datum){warn.push("geen geldige datum");ok=false}
    if(fuel&&o.km==null){warn.push("geen km-stand");ok=false}
    if(!fuel&&!o.omschr&&o.type!=="apk"){warn.push("geen omschrijving");ok=false}
    const cur=currentKm(v); if(o.km!=null&&cur!=null&&o.km>cur+20000)warn.push("km-stand veel hoger dan nu ("+km(cur)+"), klopt die?");
    let dup=false;
    if(fuel)dup=v.fuel.some(f=>f.datum===o.datum&&f.km===o.km);
    else dup=v.uitgaven.some(u=>u.datum===o.datum&&Math.abs((u.bedrag||0)-(o.bedrag||0))<0.01);
    if(dup)warn.push("staat er al in");

    if(!fuel&&o.regels.length&&o.bedrag!=null&&Math.abs(regSum-o.bedrag)>0.05)warn.push("regels tellen op tot "+eur(regSum)+", totaal is "+eur(o.bedrag));
    const cat=catVan(o);
    const pc=fuel?null:prijsCheck(vs,{cat,omschr:o.omschr||"",bedrag:o.bedrag||0,regels:o.regels});
    return {...o,vid:v.id,fuel,warn,ok,sel:ok&&!dup,cat,pc};

}

function doImport(){
  let n=0; const list=impResult||[];
  for(const o of list.filter(x=>x.veh&&x.sel)){ const v=state.vehicles.find(x=>x.id===o.vid); if(!v)continue;
    if(o.naam)v.naam=o.naam; if(o.kenteken)v.kenteken=o.kenteken.toUpperCase(); if(o.soort)v.soort=/motor/i.test(o.soort)?"motor":"auto";
    if(o.merkModel)v.merkModel=o.merkModel; if(o.brandstof)v.brandstof=o.brandstof; if(o.bouwjaar)v.bouwjaar=o.bouwjaar;
    if(o.sinds)v.eigendomSinds=o.sinds; if(o.startKm!=null)v.startKm=o.startKm; if(o.nedc!=null)v.nedc=o.nedc; if(o.apkTot)v.apk=o.apkTot;
    if(o.lasten.length)v.lasten=o.lasten; if(o.specs.length)v.specs=o.specs;
    o.klussen.forEach(t=>{if(!v.klusjes.some(k=>k.tekst.toLowerCase()===t.toLowerCase()))v.klusjes.push({id:uid(),tekst:t,klaar:false})});
    n++; }
  for(const o of list.filter(x=>!x.veh&&x.sel)){ const v=state.vehicles.find(x=>x.id===o.vid); if(!v)continue;
    if(o.fuel){v.fuel.push({id:uid(),datum:o.datum,km:o.km,bedrag:o.bedrag||null,liters:o.liters||null,vol:o.type==="tanken"?(o.vol!==false):false})}
    else{addUitgave(v,{datum:o.datum,km:o.km??null,cat:o.cat,omschr:o.omschr||(o.apkTot?"APK goedgekeurd, geldig tot "+fdate(o.apkTot):"APK"),bedrag:o.bedrag||0,taken:o.schema,regels:o.regels,notitie:o.notitie.join(" "),apkGeldigTot:o.apkTot||null});
      if(o.km!=null&&days(o.datum,todayIso())<=31&&!v.fuel.some(f=>f.km===o.km))v.fuel.push({id:uid(),datum:o.datum,km:o.km,bedrag:null,liters:null,vol:false});}
    n++; }
  impResult=null; impText=""; save(); render(); toast(n===1?"1 onderdeel toegevoegd":n+" onderdelen toegevoegd");
}

function dupOf(v,d){return v.uitgaven.find(u=>u.datum===d.datum&&Math.abs((u.bedrag||0)-(d.bedrag||0))<0.01)}
function addUitgave(v,d){
  v.uitgaven.push({id:uid(),datum:d.datum,km:d.km??null,cat:d.cat,omschr:d.omschr,bedrag:d.bedrag||0,taken:d.taken||[],regels:d.regels||[],notitie:d.notitie||""});

}

    <div class="card" id="backupcard"><h2>Back-up</h2>
     <p class="hint">Je gegevens staan alleen op deze telefoon. ${state.lastBackup?"Laatste back-up: "+fdate(state.lastBackup.slice(0,10))+".":"Je hebt nog geen back-up."} Bewaar de back-up in iCloud Drive, dan ben je niets kwijt als je telefoon stuk gaat.</p>
     <div class="row"><button class="btn primary" data-act="backup">Back-up maken</button><button class="btn" data-act="copy">Kopieer als tekst</button></div>
     <form class="f" data-form="restore"><label class="fl" for="r-txt">Back-up of startbestand terugzetten<textarea id="r-txt" name="txt" style="min-height:70px" placeholder="Kies een bestand of plak de tekst" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></label>
      <div class="row"><label class="btn" for="r-file">Bestand kiezen</label><input type="file" id="r-file" accept=".json,.txt,application/json,text/plain" data-act="file" style="position:absolute;width:1px;height:1px;opacity:0"><button class="btn danger" type="submit" id="r-submit">Terugzetten (vervangt alles)</button></div></form>
    </div>
   </div></div>`;
}

// ---------- Acties ----------
let toastT=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(toastT);toastT=setTimeout(()=>t.style.display="none",3800)}
function setTab(t){tab=t;try{localStorage.setItem("autologboek-tab",t)}catch(e){}try{history.replaceState(null,"","#"+t)}catch(e){}render();window.scrollTo(0,0)}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return; const a=b.dataset.act, v=V();
  if(a==="vehicle"){state.active=b.dataset.id;prefill=null;impResult=null;save();render()}
  else if(a==="tab"||a==="goto"){setTab(b.dataset.tab)}
  else if(a==="toggle-tank"){const on=b.checked;document.getElementById("tankvelden").style.display=on?"":"none";document.getElementById("volrij").style.display=on?"":"none"}
  else if(a==="done"){const t=TASK[b.dataset.task];prefill={cat:"Onderhoud",omschr:t.part+": "+t.actie.toLowerCase(),bedrag:0,taken:[t.id]};
    if(tab!=="onderhoud")setTab("onderhoud");else render();document.getElementById("logcard")?.scrollIntoView({behavior:"smooth",block:"start"})}
  else if(a==="monthly"){const ids=tasksFor(v).filter(t=>t.mnd===1).map(t=>t.id);v.uitgaven.push({id:uid(),datum:todayIso(),km:currentKm(v),cat:"Onderhoud",omschr:"Maandelijkse controle",bedrag:0,taken:ids});save();render();toast("Maandelijkse controle vastgelegd")}
  else if(a==="clearprefill"){prefill=null;render()}
  else if(a==="edit"){const u=v.uitgaven.find(x=>x.id===b.dataset.id);if(!u)return;prefill={...JSON.parse(JSON.stringify(u)),editId:u.id};
    if(tab!=="onderhoud"&&tab!=="kosten")setTab("onderhoud");else render();document.getElementById("logcard")?.scrollIntoView({behavior:"smooth",block:"start"})}
  else if(a==="del"){
    if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Zeker?";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="Verwijderen"}},3000);return}
    const k=b.dataset.kind,id=b.dataset.id;
    if(k==="fuel")v.fuel=v.fuel.filter(x=>x.id!==id);if(k==="uitgave")v.uitgaven=v.uitgaven.filter(x=>x.id!==id);if(k==="klus")v.klusjes=v.klusjes.filter(x=>x.id!==id);
    save();render();toast("Verwijderd")}
  else if(a==="copy"){const txt=backupText();navigator.clipboard.writeText(txt).then(()=>{state.lastBackup=new Date().toISOString();save();render();toast("Back-up gekopieerd. Plak hem in Notities en bewaar hem.")},()=>{const r=document.getElementById("r-txt");r.value=txt;r.select();toast("Kopiëren lukte niet automatisch. De tekst staat geselecteerd in het vak; kopieer hem zelf.")})}
  else if(a==="backup"){exportBackup()}
  else if(a==="monteur"){const u=v.uitgaven.find(x=>x.id===b.dataset.id),pc=u&&prijsCheck(v,u);if(!pc)return;navigator.clipboard.writeText(monteurTekst(v,u,pc)).then(()=>toast("Tekst gekopieerd. Plak hem in een bericht aan je monteur."),()=>toast("Kopiëren lukte niet."))}
  else if(a==="gotobackup"){setTab("gegevens");setTimeout(()=>document.getElementById("backupcard")?.scrollIntoView({behavior:"smooth",block:"start"}),50)}
  else if(a==="copyinstr"){navigator.clipboard.writeText(instructie()).then(()=>toast("Instructie gekopieerd. Plak hem in de chatbot, stuur daarna de foto."),()=>toast("Kopiëren lukte niet. Open 'Instructie bekijken' en kopieer de tekst zelf."))}
  else if(a==="pasteclip"){navigator.clipboard.readText().then(t=>{if(!t){toast("Het klembord is leeg.");return}impText=t;impResult=checkImport(parseImport(t));render();document.getElementById("impcard")?.scrollIntoView({behavior:"smooth",block:"start"})},()=>toast("Plakken mag niet automatisch. Tik in het vak en kies Plak."))}
  else if(a==="impadd"){doImport()}
  else if(a==="impclear"){impResult=null;impText="";render()}
});
document.addEventListener("input",e=>{
  const f=e.target.closest&&e.target.closest('form[data-form="uitgave"]'); if(!f)return;
  const h=f.querySelector("#prijshint"); if(!h)return;
  h.innerHTML=prijsHint(V(),{cat:f.querySelector("#u-cat").value,omschr:f.querySelector("#u-omschr").value,bedrag:parseNum(f.querySelector("#u-bedrag").value),regels:(prefill&&prefill.regels)||[]});
});
document.addEventListener("change",e=>{
  if(e.target.id==="u-cat"){e.target.dispatchEvent(new Event("input",{bubbles:true}))}
  const t=e.target;
  if(t.dataset.act==="impsel"&&impResult){impResult[+t.dataset.i].sel=t.checked;const btn=document.querySelector('[data-act="impadd"]');if(btn)btn.textContent=impResult.filter(o=>o.sel).length+" toevoegen";return}
  if(t.dataset.act==="klus"){const k=V().klusjes.find(x=>x.id===t.dataset.id);if(k){k.klaar=t.checked;save();render()}}
  if(t.dataset.act==="file"&&t.files[0]){t.files[0].text().then(s=>{document.getElementById("r-txt").value=s;try{const st=parseBackup(s);toast("Bestand gelezen: "+st.vehicles.filter(v=>v.kenteken||v.uitgaven.length).length+" voertuig(en). Tik op Terugzetten.")}catch(e){toast("Dit is geen back-up of startbestand van Autologboek.")}})}
});
document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target, d=new FormData(f), v=V(), kind=f.dataset.form;
  if(kind==="fuel"){
    const kmv=parseKm(d.get("km")); if(kmv==null){toast("Vul de km-stand in");return}
    const getankt=!!d.get("getankt"), bedrag=getankt?parseNum(d.get("bedrag")):null, liters=getankt?parseNum(d.get("liters")):null;
    if(getankt&&!bedrag&&!liters){toast("Vul het bedrag of de liters in, of vink 'Ik heb getankt' uit");return}
    const cur=currentKm(v);
    const before=taskStatus(v).filter(s=>s.status==="over"||s.status==="binnenkort").length;
    v.fuel.push({id:uid(),datum:d.get("datum")||todayIso(),km:kmv,bedrag:bedrag||null,liters:liters||null,vol:getankt?!!d.get("vol"):false});
    save(); render();
    const seg=segments(v), last=seg[seg.length-1], due=taskStatus(v).filter(s=>s.status==="over"||s.status==="binnenkort");
    let msg="Opgeslagen: "+km(kmv);
    if(cur!=null&&kmv<cur)msg+=" (lager dan je vorige stand van "+km(cur)+", klopt dat?)";
    else if(last&&last.id===v.fuel[v.fuel.length-1].id)msg+=last.liters?" · 1 op "+nl1.format(last.km/last.liters):" · "+eur(last.euro/last.km*100)+"/100 km";
    if(due.length>before)msg+=" · Let op: "+due[0].part.toLowerCase()+" komt eraan";
    toast(msg);
  }
  else if(kind==="uitgave"){
    const omschr=String(d.get("omschr")||"").trim(); if(!omschr){toast("Vul in wat er gedaan is");return}
    const p=prefill||{};
    const entry={datum:d.get("datum")||todayIso(),km:parseKm(d.get("km")),cat:d.get("cat"),omschr,bedrag:parseNum(d.get("bedrag"))||0,taken:d.getAll("taak"),regels:p.regels||[],notitie:p.notitie||"",apkGeldigTot:p.apkGeldigTot||null};
    if(p.editId){const u=v.uitgaven.find(x=>x.id===p.editId);if(u)Object.assign(u,{datum:entry.datum,km:entry.km,cat:entry.cat,omschr,bedrag:entry.bedrag,taken:entry.taken})}
    else addUitgave(v,entry);
    prefill=null; save(); render(); toast((p.editId?"Gewijzigd: ":"Vastgelegd: ")+omschr);
  }
  else if(kind==="klus"){const t=String(d.get("tekst")||"").trim();if(t){v.klusjes.unshift({id:uid(),tekst:t,klaar:false});save();render();document.getElementById("k-new")?.focus()}}
  else if(kind==="voertuig"){
    v.naam=String(d.get("naam")||"").trim()||v.naam; v.soort=d.get("soort")==="motor"?"motor":"auto";
    ["kenteken","merkModel","brandstof","bouwjaar","apk","eigendomSinds"].forEach(k=>v[k]=String(d.get(k)||"").trim());
    v.kenteken=v.kenteken.toUpperCase();
    v.startKm=parseKm(d.get("startKm")); v.nedc=parseNum(d.get("nedc"));
    const sd=String(d.get("ssDatum")||""), sk=parseKm(d.get("ssKm"));
    v.schemaStart=(sd||sk!=null)?{datum:sd||null,km:sk}:null;
    v.lasten=String(d.get("lasten")||"").split("\n").map(l=>parseLastRegel(l.trim())).filter(Boolean);
    v.specs=String(d.get("specs")||"").split("\n").map(l=>{const i=l.indexOf(":");return i<0?null:[l.slice(0,i).trim(),l.slice(i+1).trim()]}).filter(x=>x&&x[0]);
    save(); render(); toast("Gegevens opgeslagen");
  }
  else if(kind==="restore"){
    let st; try{st=parseBackup(d.get("txt"))}catch(x){toast("Dit is geen geldige back-up. Kies het bestand of plak de volledige tekst.");return}
    const btn=document.getElementById("r-submit");
    if(hasData()&&Date.now()-restoreArmed>5000){restoreArmed=Date.now();if(btn){btn.classList.add("armed");btn.textContent="Zeker? Tik nogmaals"}return}
    restoreArmed=0; const lb=state.lastBackup; state=st; if(!state.active||!state.vehicles.some(v=>v.id===state.active))state.active=state.vehicles[0].id;
    state.lastBackup=st.lastBackup||lb||new Date().toISOString(); prefill=null; impResult=null; save(); setTab("overzicht"); toast("Gegevens teruggezet");
  }
  else if(kind==="import"){impText=String(d.get("txt")||"");impResult=checkImport(parseImport(impText));render();document.getElementById("impcard")?.scrollIntoView({behavior:"smooth",block:"start"})}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h!==tab&&TABS.some(t=>t[0]===h)){tab=h;render()}});

backupPill();
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol!=="file:"){const had=!!navigator.serviceWorker.controller;let done=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!done){done=true;location.reload()}});navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
